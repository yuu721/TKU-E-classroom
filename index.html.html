<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>淡江工學大樓 E 教室狀態</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2024;--sub:#6a7280;--line:#e3e6eb;--free:#1a8d4f;--freebg:#e5f5ec;--busy:#c2372f;--busybg:#fbe9e7;--soon:#9a6200;--soonbg:#fff1d6;--accent:#1f5fbf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--text:#eceff3;--sub:#98a1ae;--line:#2c323b;--free:#52d08a;--freebg:#17301f;--busy:#ff8a80;--busybg:#3a1d1b;--soon:#ffc766;--soonbg:#3a2d12;--accent:#7fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--text:#eceff3;--sub:#98a1ae;--line:#2c323b;--free:#52d08a;--freebg:#17301f;--busy:#ff8a80;--busybg:#3a1d1b;--soon:#ffc766;--soonbg:#3a2d12;--accent:#7fb0ff;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px;max-width:640px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--sub);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
select,input,button{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
button{color:var(--accent);cursor:pointer}
.now{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--freebg);color:var(--free);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.chip.soon{background:var(--soonbg);color:var(--soon)}
h2{font-size:15px;margin:20px 0 8px;color:var(--sub)}
.room{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.n{font-weight:700;font-size:17px}
.d{font-size:13px;color:var(--sub)}
.tag{white-space:nowrap;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px}
.free .tag{background:var(--freebg);color:var(--free)}
.busy .tag{background:var(--busybg);color:var(--busy)}
.soon .tag{background:var(--soonbg);color:var(--soon)}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:8px}
.strip i{height:8px;border-radius:2px;background:var(--line)}
.strip i.b{background:var(--busy);opacity:.75}
.strip i.c{outline:2px solid var(--accent);outline-offset:1px}
.lab{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;font-size:10px;color:var(--sub);text-align:center;margin-top:2px}
.foot{color:var(--sub);font-size:12px;margin:24px 0 8px}
</style>
</head>
<body>
<h1>工學大樓（E）教室狀態</h1>
<div class="sub" id="clock"></div>
<div class="bar">
  <select id="day"><option value="1">週一</option><option value="2">週二</option><option value="3">週三</option><option value="4">週四</option><option value="5">週五</option><option value="6">週六</option><option value="0">週日</option></select>
  <input type="time" id="time">
  <select id="per"></select>
  <button id="live">回到現在</button>
</div>
<div class="now"><b>目前空的教室</b><div class="chips" id="chips"></div><div class="sub" style="margin-top:8px">黃色：15 分鐘內將開始上課</div></div>
<div id="msg" class="sub"></div>
<div id="list"></div>
<div class="foot">資料：淡江 115 學年度第 1 學期課表（週一至週五，週六未收錄）。僅依課表判斷，臨時調課、補課、社團或考試借用不會顯示。本頁只顯示課表排課狀況，教室沒有排課不代表可以自由使用，需要使用請依學校規定申請借用。E219 等實驗室請留意是否開放。非學校官方網站。<br>每間教室下方的小方塊為第 1～10 節（外框為目前節次，紅色有課）。</div>

<script>
// 格式：'起-迄 課名;...'，星期一到五
const RAW={
E214:{1:'3-4 程式語言(一)|陳瑞發;6-7 程式語言|助教;8 資料結構|助教;9-10 專案規劃與控制|范素玲',2:'1 超大型積體電路概論|楊維斌;2 人工智慧導論|蕭吉甫;3-4 程式語言|賓浩宇;5 程式語言(一)|助教;6-7 程式語言(一)|陳瑞發;8-9 組合語言|莊博任;10 資料結構|助教',3:'2 組合語言|助教;3-4 數值方法|賓浩宇;6-7 組合語言|陳柏翔;8 程式設計(一)|助教',4:'1-2 組合語言|莊博任;3-4 程式設計(一)|衛信文;6-7 組合語言|助教;8-9 資料結構|莊博任;10 資料結構|助教',5:'2 計算機概論|助教;3-4 機械畫實作|顏子評'},
E219:{1:'2-4 進階通信實驗|李揚漢;7-9 微處理機實驗|陳柏翔',2:'2-4 微處理機實驗|吳榮厚;6-8 微處理機實驗|戴賢閔',3:'2-4 微處理機實驗|葉俊安;6-8 微處理機實驗|翁坤鐸',4:'8-10 微處理機實驗|陳信良;11-13 FPGA開發平台概論|李世安',5:'2-4 微處理機實驗|周建興;6-8 微處理機實驗|李揚漢'},
E231:{1:'1 程式設計(一)|助教;3-4 程式設計實務|廖書漢;5 控制系統設計|助教;6 計算機與人工智慧概論|助教;7-8 工程圖學及電腦繪圖|蔡明修;9-10 地球生態環境|黃富國',2:'1-2 計算機概論|陳映濃;3-4 網路程式設計|徐煥智;7-8 數值方法|賓浩宇;9-10 BIM工程應用及程式基礎|楊鎧碩',3:'1-2 程式設計(一)|饒建奇;3 資料結構|何政昌;4 資料結構|助教;6 資料結構|莊博任;8-9 資料結構|饒建奇;10 組合語言|助教',4:'2 計算機概論|陳映濃;3-4 C語言程式設計|汪愷悌;6-7 基礎機器人學|劉智誠;8 資料結構|饒建奇;9-10 程式設計實務|曾憲威',5:'1-2 程式設計(一)|邱普運;3-4 統計學習|顏玉郁'},
E232:{1:'3-4 俄語企業實習(一)|鄭盈盈;7-8 工程專案管理|范素玲;9-10 進階程式語言|徐益書',2:'1-2 電腦輔助設計|曾憲威;3-4 程序設計|葉俊良;6-8 大一AI實驗|劉皇杏;9-10 資訊科技科教材教法|楊鎮源',3:'2-4 進階類比積體電路設計|陳信良;7-9 進階通信實驗|戴賢閔',4:'6-7 工程計算軟體應用|蔡明修',5:''},
E236:{1:'1-2 人工智慧導論|吳乾埼;3-4 程式語言(一)|林承賢;8 網路與通訊|助教;9 資料庫|助教',2:'2 程式設計(一)|助教;3-4 程式設計(一)|饒建奇;5 程式語言(一)|助教;6-7 程式語言(一)|林承賢;9-10 工程圖學及電腦繪圖|蔡明修',3:'2 程序設計|葉俊良;3-5 程序設計|陳逸航;6-8 分散式系統與邊緣架構|黃勝志;9-10 組合語言|陳柏翔',4:'2-4 程序設計|陳逸航;6-7 程式語言|賓浩宇;8-9 地理資訊系統在工程上之應用|洪毓茹;10 程式設計(一)|助教',5:'1-2 人工智慧導論|鍾隆維;6-7 程式設計(一)|衛信文'},
E304:{1:'2 空氣動力學|牛仰堯;3-4 高等材料力學|應宜雄;5-6 環境未來|康世芳;7-8 電機工程概論|李慶烈;10 微積分|曾易聰',2:'1-2 中國語文能力表達|錢天善;3-4 材料力學(一)|王鈺詞;6-7 建築物理環境|游雅婷;8-10 電子實驗|陳一葳',3:'1-2 科技進化|朱留;3-5 世界建築史(一)|顏亮平;6-7 計算機與人工智慧概論|黃紹綱;8 鋼筋混凝土|李家瑋;9-10 大學學習|葉劍木、紀珊如',4:'1 污水工程|維恩亞;2 資料結構|助教;3-4 超大型積體電路概論|楊維斌;6-7 科技永續|黃友麟;8-9 電子計算機工程應用(一)|史建中',5:'1-2 英文(二)|馬天樂;3-4 英文(一)|温志樺;6-7 英文(二)|袁欣祺;9-10 大學學習|蕭奕凡、杜佳蓉'},
E402:{1:'3-4 控制系統設計|周永山;6-7 計算機概論|陳啓禎;8-9 材料力學(一)|王鈺詞;10 高分子化學|助教',2:'2-4 工程與材料力學|姚忠達;6 無機材料|助教;7-8 無機材料|余宣賦;9 化工熱力學|黃招財;10 化工熱力學|助教',3:'1-2 航空材料學|陳步偉;3-4 動力學|田豐;6-8 工程數學|韓相宜;9-10 大學學習|林正嵐、葉俊良',4:'1-2 熱力學(二)|馬述聖;3 作業系統|陳映濃;4 計算機概論|陳啓禎;6 半導體物理|助教;7 半導體物理|陳信良;8-9 計算機組織|李維聰',5:'2 作業系統|助教;3 作業系統|衛信文;4 半導體物理|江正雄;6-7 光纖傳輸實務|鍾隆維;8-9 基礎控制建模與分析|陳一葳'},
E512:{1:'3-4 測量學(一)|葉怡成;6 創新與創業|馮若梅;7-9 流體力學|李世鳴',2:'2-4 正規語言與自動機理論|顏淑惠;6 計算機組織|李維聰;7 計算機組織|助教;8-9 節能照明技術|許世杰',3:'3-4 邏輯設計|李揚漢;6-7 專利管理|陳惇凱;9-10 水資源及環境工程概論|陳永祥',4:'2 電路學|助教;3 工程數學|周永山;4 工程數學|助教;7-8 資料結構|鄧有光;9 資料結構|助教;10 資料結構|鄧有光',5:'2 微積分(一)|助教;3-4 線性代數|莊惟棟;6-9 英文(二)|高淑婷'}
};
const start=p=>490+(p-1)*60,end=p=>start(p)+50;
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const get=(r,d)=>(RAW[r][d]||'').split(';').filter(Boolean).map(x=>{const m=x.match(/^(\d+)(?:-(\d+))? (.+)\|(.+)$/);return{s:+m[1],e:+(m[2]||m[1]),n:m[3],t:m[4]}});
const lb=c=>c.n+'（'+(c.t=='助教'?'助教實習':c.t)+'）';
const $=id=>document.getElementById(id);let live=true;
function now(){if(live){const n=new Date();$('day').value=n.getDay();$('time').value=fmt(n.getHours()*60+n.getMinutes())}
 const[h,m]=$('time').value.split(':').map(Number);return{day:+$('day').value,t:h*60+m}}
function render(){
 const{day,t}=now();syncPer(t);$('clock').textContent=(live?'即時 ':'模擬 ')+'週'+'日一二三四五六'[day]+' '+fmt(t);
 $('msg').textContent=day==6?'週六課表尚未收錄，以下全部顯示為空教室，僅供參考。':day==0?'週日通常沒有課。':'';
 let html='',chips='',fl='';
 Object.keys(RAW).forEach(r=>{
  const cl=day>=1&&day<=5?get(r,day):[];
  const cur=cl.find(c=>start(c.s)<=t&&t<end(c.e));
  const nxt=cl.filter(c=>start(c.s)>t).sort((a,b)=>start(a.s)-start(b.s))[0];
  const floor=r[1]+' 樓';if(floor!==fl){fl=floor;html+='<h2>'+floor+'</h2>'}
  let cls,tag,det;
  if(cur){cls='busy';tag='上課中';det=lb(cur)+'・'+fmt(end(cur.e))+' 下課'}
  else if(nxt&&start(nxt.s)-t<=15){cls='soon';tag='即將上課';det=fmt(start(nxt.s))+' 開始：'+lb(nxt);chips+=`<span class="chip soon">${r}・空到 ${fmt(start(nxt.s))}</span>`}
  else{cls='free';tag='空教室';det=nxt?'空到 '+fmt(start(nxt.s))+'，下一堂：'+lb(nxt):'今天之後沒有課';chips+=`<span class="chip">${r}・${nxt?'空到 '+fmt(start(nxt.s)):'今天都空'}</span>`}
  let strip='';for(let p=1;p<=10;p++){const b=cl.some(c=>c.s<=p&&p<=c.e);const c=start(p)<=t&&t<start(p)+60;strip+=`<i class="${b?'b':''} ${c?'c':''}"></i>`}
  html+=`<div class="room ${cls}"><div class="top"><div><div class="n">${r}</div><div class="d">${det}</div></div><span class="tag">${tag}</span></div><div class="strip">${strip}</div></div>`});
 $('list').innerHTML=html;$('chips').innerHTML=chips||'<span class="sub">目前沒有空教室</span>'}
$('day').onchange=$('time').onchange=()=>{live=false;render()};
$('per').innerHTML='<option value="">第幾節</option>'+Array.from({length:14},(_,i)=>`<option value="${i+1}">第${i+1}節 ${fmt(start(i+1))}</option>`).join('');
function syncPer(t){const p=Math.floor((t-490)/60)+1;$('per').value=(p>=1&&p<=14)?String(p):''}
$('per').onchange=()=>{const p=+$('per').value;if(!p)return;live=false;$('time').value=fmt(start(p));render()};
$('live').onclick=()=>{live=true;render()};
render();setInterval(()=>{if(live)render()},30000);
</script>
</body>
</html>
